
<div class="page">
  <section class="card">
    <h1>Create Account</h1>
    <p class="subtitle">Register for your employee account</p>

    <form #form="ngForm" (ngSubmit)="submit()">
      <label for="name">Full name</label>
      <input
        id="name"
        name="name"
        [(ngModel)]="name"
        required
        maxlength="100"
        autocomplete="name"
      />

      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        maxlength="150"
        autocomplete="email"
      />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />

      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p
  *ngIf="message"
  class="message"
  [class.success]="messageType === 'success'"
  [class.error]="messageType === 'error'"
  role="status"
  aria-live="polite"
>
  {{ message }}
</p>

    <p class="footer">
      Already registered?
      <a routerLink="/login">Login here</a>
    </p>
  </section>
</div>
